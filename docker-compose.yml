# Local stack: PostgreSQL 16 + pgvector and the app. Not a production deployment.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legaldost
      POSTGRES_USER: legaldost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldost"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://legaldost:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/legaldost
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
