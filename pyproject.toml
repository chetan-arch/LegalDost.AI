[project]
name = "legaldost"
version = "0.1.0"
description = "WhatsApp-first, evidence-grounded Indian legal information assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pypdf>=5.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "fonttools>=4.50",  # lets pypdf decode embedded CFF fonts in Gazette PDFs
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
local-embeddings = ["sentence-transformers>=3.0", "torch>=2.4"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
legaldost = "legaldost.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legaldost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# E501: the formatter owns line length; remaining long lines are user-facing strings.
# UP046: keep typing.Generic for readability.
ignore = ["S101", "B008", "S311", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
"legaldost/textutil.py" = ["SIM905"]
"legaldost/retrieval/search.py" = ["SIM905"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
