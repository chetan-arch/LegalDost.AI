  # ---------------------------------------------------------------- succession / property
  - source_key: in-hindu-succession-act-1956
    title: "The Hindu Succession Act, 1956 (No. 30 of 1956) — text WITHOUT the 2005 amendment"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (copy hosted by the Supreme Court Legal Services Committee)"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [property, family]
    identifiers: {act_no: "30 of 1956"}
    source_url: "https://sclsc.gov.in/theme/front/pdf/ACTS%20FINAL/THE%20HINDU%20SUCCESSION%20ACT,%201956.pdf"
    host_note: >-
      This copy does NOT include the Hindu Succession (Amendment) Act, 2005, which substituted
      section 6 (daughters as coparceners) and omitted section 4(2). For those provisions use the
      2005 amending Act registered separately.
    languages: [en]
    publication_date: 1956-06-17
    legal_status: amended
    status_note: "Amended by Act 39 of 2005 (s.6 substituted, s.4(2) omitted); this copy predates that amendment."
    fetch_url: "https://sclsc.gov.in/theme/front/pdf/ACTS%20FINAL/THE%20HINDU%20SUCCESSION%20ACT,%201956.pdf"
    notes: "Fetched 2026-10-21. Date taken from the Act's text header."

  - source_key: in-hindu-succession-amendment-act-2005
    title: "The Hindu Succession (Amendment) Act, 2005 (No. 39 of 2005)"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (copy hosted by the Government of Tamil Nadu)"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [property, family]
    identifiers: {act_no: "39 of 2005", amends: "Hindu Succession Act, 1956"}
    source_url: "https://www.cra.tn.gov.in/tnscs/Files/act/014b_Hindu%20Sucession%20amendment%20act%2039%20of%202005.pdf"
    host_note: "Reproduction hosted by a Government of Tamil Nadu site; not the Gazette or India Code copy."
    languages: [en]
    publication_date: 2005-09-05
    legal_status: unknown
    status_note: "Commencement by notification under its section 1(2); not verified here. The Supreme Court's 2020 decision in Vineeta Sharma v. Rakesh Sharma interpreted the new section 6 and is not loaded yet."
    fetch_url: "https://www.cra.tn.gov.in/tnscs/Files/act/014b_Hindu%20Sucession%20amendment%20act%2039%20of%202005.pdf"
    notes: "Fetched 2026-10-21. Date in the header ([5th September, 2005]) is the assent date shown in the text."

