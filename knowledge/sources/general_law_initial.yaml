# General-law sources that were downloadable on 2026-10-21 (India Code itself returned gateway
# timeouts). Each is a real document; metadata comes from the document text or is left unknown.
# None is advocate-reviewed yet. Copies hosted by courts or departments are faithful reproductions
# of the Act but are not the Gazette / India Code text: replace them with India Code copies when
# that site is reachable, and check later amendments before marking anything in_force.
#
#   legaldost ingest manifest knowledge/sources/general_law_initial.yaml

name: general_law_initial
description: Family, maintenance/alimony, succession and criminal-law sources for broad coverage.

sources:
  # ---------------------------------------------------------------- family / maintenance
  - source_key: in-hindu-marriage-act-1955
    title: "The Hindu Marriage Act, 1955"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (copy hosted by the Punjab and Haryana High Court Legal Services Committee)"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [family]
    source_url: "https://www.highcourtchd.gov.in/hclscc/subpages/pdf_files/4.pdf"
    host_note: "Reproduction hosted by an official court body (amendment notes up to 2019 visible); not the Gazette or India Code copy."
    languages: [en]
    legal_status: unknown
    fetch_url: "https://www.highcourtchd.gov.in/hclscc/subpages/pdf_files/4.pdf"
    notes: "Fetched 2026-10-21; contains s.13B (mutual consent divorce), s.24/25 (maintenance, permanent alimony)."

  - source_key: in-hindu-adoptions-maintenance-act-1956
    title: "The Hindu Adoptions and Maintenance Act, 1956 (No. 78 of 1956)"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (copy hosted by the High Court of Andhra Pradesh)"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [family]
    identifiers: {act_no: "78 of 1956"}
    source_url: "https://aphc.gov.in/docs/safe_rule_01112025095208.pdf"
    host_note: "Reproduction hosted by the High Court of Andhra Pradesh; not the Gazette or India Code copy."
    languages: [en]
    legal_status: unknown
    fetch_url: "https://aphc.gov.in/docs/safe_rule_01112025095208.pdf"
    notes: "Fetched 2026-10-21; Chapter III covers maintenance of wife, children and aged parents."

  - source_key: in-protection-of-women-from-domestic-violence-act-2005
    title: "The Protection of Women from Domestic Violence Act, 2005"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (copy hosted by the National Commission for Women)"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [family, criminal]
