  # ---------------------------------------------------------------- vehicles: window glass
  - source_key: in-gazette-cmvr-seventh-amendment-2020-gsr-457e
    title: "Central Motor Vehicles (Seventh Amendment) Rules, 2020 — G.S.R. 457(E), 20 July 2020 (substitutes Rule 100: safety glass and glazing)"
    issuing_authority: "Ministry of Road Transport and Highways (Gazette of India, Extraordinary; copy hosted by LiveLaw)"
    document_type: notification
    source_category: secondary
    jurisdiction: IN
    legal_domains: [traffic]
    identifiers: {gsr: "457(E)", amends: "Central Motor Vehicles Rules, 1989", rule: "100"}
    source_url: "https://www.livelaw.in/pdf_upload/pdf_upload-378588.pdf"
    host_note: >-
      Gazette of India text (Hindi and English) reproduced by LiveLaw, a legal news site; the
      MoRTH copy returned an HTML page instead of the PDF. Rule 100 was reportedly amended again
      in 2023 (First Amendment Rules, 2023), which is not loaded.
    languages: [en, hi]
    publication_date: 2020-07-20
    commencement_date: 2021-04-01
    legal_status: amended
    status_note: "New Rule 100(1)-(4) applies on and from 1 April 2021 (per its own text); later amendments not checked."
    fetch_url: "https://www.livelaw.in/pdf_upload/pdf_upload-378588.pdf"
    notes: "Fetched 2026-10-21. Rule 100(2): windscreen and rear window at least 70% visual transmission; 100(3): side windows at least 50%; 100(4): owner must maintain these."
