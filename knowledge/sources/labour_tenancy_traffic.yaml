name: labour_tenancy_traffic
description: Labour Codes (wages, industrial relations), the Karnataka Rent Act and the 2020 Rule 100 amendment.

sources:
  # ---------------------------------------------------------------- employment and labour
  - source_key: in-code-on-wages-2019
    title: "The Code on Wages, 2019 (No. 29 of 2019)"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (copy hosted by the Ministry of Labour and Employment)"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [employment]
    identifiers: {act_no: "29 of 2019"}
    source_url: "https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf"
    host_note: "Act as enacted, hosted by the Ministry of Labour and Employment; not the Gazette or India Code copy. Later amendments not checked."
    languages: [en]
    publication_date: 2019-08-08
    legal_status: unknown
    status_note: >-
      PIB (Ministry of Labour, 21 Nov 2025) states the four Labour Codes were made effective from
      21 November 2025, replacing the Payment of Wages Act, Minimum Wages Act, Payment of Bonus Act
      and Equal Remuneration Act; relevant provisions of the old Acts continue during transition.
      The commencement notification itself is not loaded.
    fetch_url: "https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf"
    notes: "Fetched 2026-10-21. Date is the assent date in the text header ([8th August, 2019.])."

  - source_key: in-industrial-relations-code-2020
    title: "The Industrial Relations Code, 2020 (No. 35 of 2020)"
    issuing_authority: "Legislative Department, Ministry of Law and Justice (Gazette text reproduced by PRS Legislative Research)"
    document_type: statute
    source_category: secondary
    jurisdiction: IN
    legal_domains: [employment]
    identifiers: {act_no: "35 of 2020"}
    source_url: "https://prsindia.org/files/bills_acts/acts_parliament/2020/Industrial%20Relations%20Code,%202020.pdf"
    host_note: "Act as enacted, hosted by PRS Legislative Research (non-profit, not a government site). Replace with the India Code copy when reachable."
    languages: [en]
    publication_date: 2020-09-28
    legal_status: unknown
    status_note: >-
      PIB states it took effect on 21 November 2025, replacing the Industrial Disputes Act, 1947,
      the Trade Unions Act, 1926 and the Industrial Employment (Standing Orders) Act, 1946, which
      still govern earlier disputes and are not loaded.
    fetch_url: "https://prsindia.org/files/bills_acts/acts_parliament/2020/Industrial%20Relations%20Code,%202020.pdf"
    notes: "Fetched 2026-10-21. Act number and date taken from the text header."

