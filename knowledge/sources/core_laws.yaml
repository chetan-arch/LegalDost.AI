# Core central and Karnataka laws for general coverage — TEMPLATE.
# (Acts already loaded from other hosts live in general_law_initial.yaml.)
#
# Every entry is `enabled: false` until an operator has the real document. To load one:
#   1. Download the official PDF (India Code: https://www.indiacode.nic.in for central Acts;
#      Karnataka DPAL: https://dpal.karnataka.gov.in for state Acts; eGazette for notifications).
#   2. Save it as knowledge/sources/files/<source_key>.pdf  (this folder is git-ignored).
#   3. Set `source_url` to the exact page/PDF URL you downloaded it from.
#   4. Fill in act number and dates ONLY from the document itself (leave null if unsure).
#   5. Set `enabled: true`, then run:
#        legaldost ingest manifest knowledge/sources/core_laws.yaml
#   6. After an advocate checks it: legaldost sources review <source_key> --reviewer "Adv. Name"
#      and set its legal status: legaldost sources status <source_key> in_force --note "..."
#
# Loading a source tagged with a domain is what switches that domain on for users.
# Titles below are the Acts' short titles; nothing else is pre-filled on purpose.

name: core_laws
description: Central and Karnataka legislation for broad everyday-law coverage.

sources:
  # ---------------------------------------------------------------- criminal & police
  - source_key: in-indian-penal-code-1860
    enabled: false
    title: "The Indian Penal Code, 1860"
    issuing_authority: "Legislative Department, Ministry of Law and Justice"
    document_type: statute
    source_category: primary_official
    jurisdiction: IN
    legal_domains: [criminal]
    source_url: "REPLACE_WITH_DOWNLOAD_URL"
    local_file: files/in-indian-penal-code-1860.pdf
    notes: "Mark legal_status as superseded/repealed with the correct note once confirmed; still relevant for incidents before the BNS commenced."
