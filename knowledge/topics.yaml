# Topic and fact registry.
#
# This file is PRODUCT CONFIGURATION, not law. It decides:
#   * which legal areas the assistant recognises,
#   * which facts are material enough to ask about before answering,
#   * which extra search terms help retrieval find the right passages,
#   * which topics are high-risk (always recommend a lawyer).
# It never states a legal conclusion. Every entry should be reviewed by an Indian advocate
# (see review_status). Kannada strings need native-speaker review.

review_status: unreviewed

domains:
  # A domain is offered to users only when (a) enabled here AND (b) at least one current,
  # available source tagged with that domain is loaded in the database. Loading sources is
  # what expands coverage; no code change is needed. Set enabled: false to switch one off.
  traffic:        {enabled: true, label: {en: "Traffic and vehicles", kn: "ಸಂಚಾರ ಮತ್ತು ವಾಹನಗಳು"}}
  criminal:       {enabled: true, label: {en: "Criminal law", kn: "ಅಪರಾಧ ಕಾನೂನು"}}
  police:         {enabled: true, label: {en: "Police procedure", kn: "ಪೊಲೀಸ್ ಕಾರ್ಯವಿಧಾನ"}}
  constitutional: {enabled: true, label: {en: "Constitutional and fundamental rights", kn: "ಸಾಂವಿಧಾನಿಕ ಮತ್ತು ಮೂಲಭೂತ ಹಕ್ಕುಗಳು"}}
  consumer:       {enabled: true, label: {en: "Consumer complaints", kn: "ಗ್ರಾಹಕ ದೂರುಗಳು"}}
  tenancy:        {enabled: true, label: {en: "Rent and tenancy", kn: "ಬಾಡಿಗೆ ಮತ್ತು ಗುತ್ತಿಗೆ"}}
  property:       {enabled: true, label: {en: "Land and property", kn: "ಭೂಮಿ ಮತ್ತು ಆಸ್ತಿ"}}
  family:         {enabled: true, label: {en: "Family law", kn: "ಕೌಟುಂಬಿಕ ಕಾನೂನು"}}
  employment:     {enabled: true, label: {en: "Employment and labour", kn: "ಉದ್ಯೋಗ ಮತ್ತು ಕಾರ್ಮಿಕ"}}
  cyber:          {enabled: true, label: {en: "Cybercrime and online fraud", kn: "ಸೈಬರ್ ಅಪರಾಧ ಮತ್ತು ಆನ್‌ಲೈನ್ ವಂಚನೆ"}}
  government:     {enabled: true, label: {en: "Government services and RTI", kn: "ಸರ್ಕಾರಿ ಸೇವೆಗಳು ಮತ್ತು ಮಾಹಿತಿ ಹಕ್ಕು"}}
