facts:
  jurisdiction:
    kind: jurisdiction
    question:
      en: "Which Indian state did this happen in (for example, Karnataka)?"
      kn: "ಇದು ಭಾರತದ ಯಾವ ರಾಜ್ಯದಲ್ಲಿ ನಡೆಯಿತು (ಉದಾಹರಣೆಗೆ, ಕರ್ನಾಟಕ)?"
  glazing_type:
    kind: enum
    question:
      en: "Is the tint part of the glass as fitted by the vehicle manufacturer, or is it a film/sticker added to the glass later?"
      kn: "ಟಿಂಟ್ ವಾಹನ ತಯಾರಕರು ಅಳವಡಿಸಿದ ಗಾಜಿನ ಭಾಗವೇ, ಅಥವಾ ನಂತರ ಗಾಜಿಗೆ ಅಂಟಿಸಿದ ಫಿಲ್ಮ್/ಸ್ಟಿಕರ್ ಆಗಿದೆಯೇ?"
    values:
      factory_fitted:
        en: ["factory", "manufacturer", "came with the car", "came with the vehicle", "company fitted", "company-fitted", "oem", "original glass", "built-in", "built in"]
        kn: ["ಕಂಪನಿ", "ತಯಾರಕ", "ಫ್ಯಾಕ್ಟರಿ", "ಮೂಲ ಗಾಜು"]
      aftermarket_film:
        en: ["film", "sticker", "aftermarket", "after-market", "added later", "pasted", "stuck on", "applied later", "wrap"]
        kn: ["ಫಿಲ್ಮ್", "ಸ್ಟಿಕರ್", "ಅಂಟಿಸಿದ", "ನಂತರ ಹಾಕಿದ"]
      unsure:
        en: ["not sure", "don't know", "dont know", "no idea", "unsure"]
        kn: ["ಗೊತ್ತಿಲ್ಲ", "ಖಚಿತವಿಲ್ಲ"]
  vlt_percent:
    kind: percent
    question:
      en: "Do you know the light transmission (VLT) percentage of the glass?"
      kn: "ಗಾಜಿನ ಬೆಳಕು ಹಾದುಹೋಗುವ (VLT) ಶೇಕಡಾವಾರು ನಿಮಗೆ ತಿಳಿದಿದೆಯೇ?"
  challan_issued:
    kind: yes_no
    question:
      en: "Have you been given a challan or written notice? If yes, which section or rule does it mention?"
      kn: "ನಿಮಗೆ ಚಲನ್ ಅಥವಾ ಲಿಖಿತ ನೋಟಿಸ್ ನೀಡಲಾಗಿದೆಯೇ? ಹೌದಾದರೆ, ಅದರಲ್ಲಿ ಯಾವ ಸೆಕ್ಷನ್ ಅಥವಾ ನಿಯಮ ಉಲ್ಲೇಖಿಸಲಾಗಿದೆ?"
    values:
      "yes":
        en: ["challan issued", "got a challan", "gave me a challan", "received a challan", "fined", "e-challan", "notice issued", "got a notice", "was issued"]
        kn: ["ಚಲನ್ ಕೊಟ್ಟರು", "ದಂಡ ಹಾಕಿದರು", "ನೋಟಿಸ್ ಬಂತು"]
      "no":
        en: ["no challan", "not issued", "no notice", "only warned", "nothing issued"]
        kn: ["ಚಲನ್ ಇಲ್ಲ", "ನೋಟಿಸ್ ಇಲ್ಲ"]
  cited_provision:
    kind: provision
    question:
      en: "Which section or rule is written on the challan or notice?"
      kn: "ಚಲನ್ ಅಥವಾ ನೋಟಿಸ್‌ನಲ್ಲಿ ಯಾವ ಸೆಕ್ಷನ್ ಅಥವಾ ನಿಯಮ ಬರೆಯಲಾಗಿದೆ?"
  incident_date:
    kind: date
    question:
      en: "When did this happen (approximate date is fine)? The law that applies can depend on the date."
      kn: "ಇದು ಯಾವಾಗ ನಡೆಯಿತು (ಅಂದಾಜು ದಿನಾಂಕ ಸಾಕು)? ಅನ್ವಯವಾಗುವ ಕಾನೂನು ದಿನಾಂಕದ ಮೇಲೆ ಅವಲಂಬಿತವಾಗಿರಬಹುದು."

